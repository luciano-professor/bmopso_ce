[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmopso-ce"
version = "1.0.1"
description = "Binary Multi-Objective Particle Swarm Optimization with Catfish Effect (BMOPSO-CE) for pymoo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Luciano Soares de Souza", email = "43418124+luciano-professor@users.noreply.github.com" }
]

dependencies = [
    "numpy",
    "pymoo>=0.6.0",
    "pymoo-binary-problems>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
